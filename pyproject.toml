[project]
name = "shorty"
requires-python = "==3.14.*"
version = "0.0.0.dev0"

# Dependencies should NOT use "Version Matching clauses" (matching operator `==`)
# https://packaging.python.org/en/latest/specifications/version-specifiers/#version-matching
# This project uses 'uv pip compile' from https://github.com/astral-sh/uv
# which will ensure the resolved versions of both direct and indirect dependencies are pinned.
# Therefore we only need to constrain versions when some ranges
# of dependency versions are not compatible.
dependencies = [
    "flask",
    "hypercorn",
]

[dependency-groups]
# Build tools required by uv.project for sdist builds.
# See https://github.com/aspect-build/rules_py/blob/main/docs/uv.md#differences-and-gotchas
build = [
    "build",
    "setuptools",
]
test = [
    "pytest",
    "pytest-shard",
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    "shorty",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app"]

[tool.pytest]
testpaths = ["app"]

# See https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100

[tool.mypy]
pretty = true
strict = true
follow_imports = "silent"
follow_imports_for_stubs = true
